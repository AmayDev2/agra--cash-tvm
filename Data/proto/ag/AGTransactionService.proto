syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.amaytechnosystems";
option java_outer_classname = "AGService";

package com.proto.ag.service;

import "ag/TicketAgStatusData.proto";

service AGTransactionService {

  // Unary RPC method
  rpc PushAndVerifyTicketStatus(ag.object.AGTicketRequestV1) returns (ag.object.AGTicketResponseV1);

}
