syntax = "proto3";

package org.transactions.qr;

import "Transactions_Enums.proto";


option java_package = "org.transaction.qr";
option java_multiple_files = true;

message TransactionProtocol{
    TransactionType txn_type = 1; //Three type of transactions Payment, Refund and Retrieval(Reterive transaction details)
    string orderid = 2; //order_id generated by the TOM without this field transaction will be rejected
    int32 amount = 3;  //Amount of transaction to be done should be passed in case of payment and refund
    string refund_reason = 4; //Reason for refund should only be passed in case of refund 
    string txn_datetime = 5; //Date and Time of transaction
}

message TransactionResponse{
    int32 status_code = 1; // Status Code for transactions
    string error_msg = 2; //Error message for the transactions
    TransactionDetails txn_details = 3; //Transaction details object
}


//Can be customized according to the need.
message TransactionDetails{
    string txn_id = 1;
    string order_id = 2;
}


//Issue Ticket
message IssueTicket{
    OperatorData operator_data = 1;
    TicketBaseData base_data = 2;
}

message TicketResponse{
    repeated TicketData list = 1;
    int32 status_code = 2;
    string error_msg = 3;
    string ticket_ver = 4;
}

message TicketData{
    string order_id = 1;
    string qr_data = 2;
    string ticketid = 3;
    int32 entry_data = 4;
    int32 exit_data = 5;
}

message TicketBaseData{
    int32 src_id = 1;
    int32 dest_id = 2;
    int32 ticket_type = 3;
    int32 pass_count = 4;
    int32 ticket_fare = 5;
    string issue_datetime = 6;
    string order_id = 7;
}

message OperatorData{
    string line_id = 2;
    string station_id = 3;
    string equip_id = 5;
    string opr_id = 7;
    string shift_id = 8;
}

//Adjust Ticket
message AdjustTicket{
    string ticket_id = 1;
    bool entry_overwrite = 2;
    bool exit_overwrite = 3;
}

message Response{
    int32 status_code = 1;
    string error_msg = 2;
}


//Get Ticket Details
message FetchData{
    string ticket_id = 1;
}


//detailed ticket data
message TicketDetails{
     
}


