syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.amaytechnosystems";
option java_outer_classname = "BaseObject";
import "enum/Enums.proto";
import "google/protobuf/timestamp.proto";

package com.proto.baseobject;

message AEquipment{
  string equipmentId=1;
  string equipmentType=2;
  string equipmentSeq=3;
}

message ATicket{
  string ticketId = 1;
  string orderId = 2;
  string transactionId = 3;
  string transactionUk = 4;
  string ticketIssue = 5;
  string ticketExp = 6;

  string sourceStation = 13;
  string destinationStation = 14;
  com.proto.enum.TicketGenerationType genType = 15;

  string language = 18;
  double amount = 19;
  double discount = 20;
  bool isActive = 26;
  string productId = 27;
  int32 quantity = 28;

  string status = 29;
  string paymentMode = 30;
  string qrData = 31;
  bool isAdjusted=32;

  double adminCharge=33;
  string mode=34;
}

message ATicketStatus{
  bool isActive = 1;
  bool isRefunded = 3;
  bool isReplaced = 4;
  bool isExpired = 5;
  bool isUsed = 6;
  bool isAdjusted = 7;
  string status = 8;
}

message ATicketAGStatus {
  string ticketId = 1;
  com.proto.enum.TicketOperation operation =2;
  baseobject.AEquipment equipment=5;
  string time=4;
}

message ATicketAnalysis{
  ATicket ticket = 1;
  ATicketStatus ticketStatus = 2;
  ATicketHistory history = 3;
  ARefundTicket refundTicket = 4;
  repeated AdjustmentDetail adjustmentDetails = 6;
  repeated ATicketAGStatus agStatus = 7;
}

message AVersion{
  string softwareVer=1;
  string ticketVer=2;
  string faretableVer=3;

}

message AOperator{
  string operatorId=1;
  string shiftId = 21;

}

message AStation{
  string stationId=1;
  string lineId=2;
}

message ALine{
  string lineId=1;
  string lineName=2;
  string lineColor=3;
}

message AShift{
  string shiftId=1;
  google.protobuf.Timestamp shiftStart = 3;
  google.protobuf.Timestamp shiftEnd = 4;
  com.proto.enum.ShiftStatus currentStatus =5;
  int32 imprestMoney=6;
  string version=7;
}
message ATransaction{
  string transactionId = 1;
  string orderId = 2;
//  string ticketId = 3;
  string transactionUk = 4;
  string transactionType = 5;
  string transactionStatus = 6;
  string transactionMode = 7;
  string transactionTime = 8;
  string transactionAmount = 9;
  string transactionDiscount = 10;
}

message AdjustedTicket {
  string orderId = 1;
  string adjustId = 2;
  com.proto.enum.AdjustmentType adjustmentType = 3;
  string encryptedQR = 4;
  string issueTime = 5;
  string entryTime = 6;
  string exitTime = 7;
  string destination = 8;
  string ticketId = 9;
  string reason = 12;
  com.proto.enum.AdjustmentArea area = 13; // paid or unpaid
  google.protobuf.Timestamp createdAt = 16;
  google.protobuf.Timestamp updatedAt = 17;
  google.protobuf.Timestamp transactionTime = 18;
}

message ACancelTicket{
  string ticketId = 1;
  string orderId = 2;
  google.protobuf.Timestamp updatedAt = 3;
}

message AReplaceTicket{
  string ticketId = 1;
  string orderId = 2;
  string replacedId = 3;
  google.protobuf.Timestamp time = 4;
}

message ARefundTicket{
  string ticketId = 1;
  string refundMode = 2;
  string refundId = 3;
  google.protobuf.Timestamp time = 4;
  string refundAmount = 5;
  string productId = 6;
}

message AFareMedia{
  string sjt=1;
  string rjt=2;
  string group=3;
  string free=4;
  string paid=5;
}

message ARevenue{
  string qrRevenue=1;
  string cscRevenue=2;
  string totalRevenue=3;
  string agEntry=4;
  string agExit=5;
}

message AStock{
  int32 qrStock=1;
  int32 cscStock=2;
  int32 qrSales=3;
  int32 cscSales=4;
  int32 cash=5;
  google.protobuf.Timestamp time = 6;
}

message ATicketHistory{
  string ticketId = 1;
  int32 entryAllowed = 2;
  int32 entryCount = 3;
  google.protobuf.Timestamp lastEntryTime = 4;
  int32 exitAllowed = 5;
  int32 exitCount = 6;
  google.protobuf.Timestamp lastExitTime = 7;
  int32 adjustCount = 8;
  int32 adjustedEntryAllowed = 9;
  int32 adjustedEntryCount = 10;
  int32 adjustedExitAllowed = 11;
  int32 adjustedExitCount = 12;
  bool overtimeOverride = 13;
  bool overtravelOverride = 14;
}

message AdjustmentDetail {
  string adjustId = 1;
  string ticketId = 2;
  int32 amount = 3;
  string reason = 4;
  string equipmentId = 5;
  string stationId = 6;
  string lineId = 7;
  string shiftId = 8;
  string operatorId = 9;
  repeated com.proto.enum.AdjustmentType adjustmentType = 10;
  com.proto.enum.AdjustmentArea adjustmentArea = 11;
  string adjustmentTime = 12;
}

message AVersionInfo {
  string equipVer = 1;
  string swVer = 2;
  string readerSwVer=3;
  string fareVer=4;
  string productVer=5;
  string businessDayVer=6;
  string peakTimeVer=7;
  string calendarVer=8;
  string topologyVer=9;
  string usersVer=10;
  string profileVer=11;
}

message AReaderInfo {
  string readerId=1;
  string readerIp=2;
  string readerPort=3;
}