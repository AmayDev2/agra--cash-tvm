syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.amaytechnosystems";
option java_outer_classname = "TRService";

package com.proto.tr.service;

import "tr/TRTransactionData.proto";



service TRTransactionService {
  rpc GetTicketAnalysisDataByNumber(tr.object.TRTicketRequestV1) returns (tr.object.TRTicketAnalysisResponseV1);
}
