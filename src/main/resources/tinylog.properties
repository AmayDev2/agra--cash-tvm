# Console writer (all logs, detailed)
writer1 = console
writer1.level = DEBUG
writer1.format = {date: yyyy-MM-dd HH:mm:ss.SSS} [{level}] {class}.{method}() [{thread}] : {message}

# Business log writer (only messages, rotate daily + size, keep 30 days)
writer2 = rolling file
writer2.level = DEBUG
writer2.file = C:/tvm-config/business_logs/business_{date: yyyy-MM-dd}_{count}.log
writer2.policies = daily, size: 10MB
writer2.backups = 30
writer2.latest = C:/tvm-config/business_logs/latest.log
writer2.convert = gzip
writer2.tag = BUSINESS
writer2.format = {message}

# Application log writer (detailed, rotate daily + size, keep 30 days)
writer3 = rolling file
writer3.level = DEBUG
writer3.file = C:/tvm-config/application_logs/app_{date: yyyy-MM-dd}_{count}.log
writer3.policies = daily, size: 10MB
writer3.backups = 30
writer3.latest = C:/tvm-config/application_logs/latest.log
writer3.convert = gzip
writer3.tag = APPLICATION
writer3.format = {date: yyyy-MM-dd HH:mm:ss.SSS} [{level}] {class}.{method}() [{thread}] : {message}
