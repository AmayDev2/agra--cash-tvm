# Console writer
writer1 = console
writer1.level = DEBUG
writer1.format = {date: yyyy-MM-dd HH:mm:ss.SSS} [{level}] {class}.{method}() [{thread}] : {message}

# Rolling file writer
writer2 = rolling file
writer2.level = INFO
writer2.format = {date: yyyy-MM-dd HH:mm:ss.SSS} [{level}] {class}.{method}() [{thread}] : {message}
writer2.file = E:/Amay Technosystems/AFC/BackupTVM/AgraCashTVM/logs/tom_{date: yyyy-MM-dd}_{count}.log
writer2.policies = size: 10MB
writer2.backups = 5
writer2.latest = E:/Amay Technosystems/AFC/BackupTVM/AgraCashTVM/logs/latest.log
writer2.convert = gzip
